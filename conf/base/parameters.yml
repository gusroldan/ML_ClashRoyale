# Feature Engineering parameters
feature_engineering:
  test_size: 0.2
  random_state: 42
  max_samples_per_class: 5000  # Número de muestras por clase (reducido para usar menos recursos)
                                  # Total = max_samples_per_class * 2 = 100K registros
                                  # Ejemplos:
                                  # 50000 = 100K total (rápido, menos recursos)
                                  # 100000 = 200K total (más rápido para pruebas)
                                  # 250000 = 500K total (rápido)
                                  # 500000 = 1M total (recomendado)
                                  # 1000000 = 2M total (más lento pero mejor calidad)

# Classification parameters
classification:
  cv_folds: 3  # Reducido de 5 a 3 para usar menos recursos
  scoring: 'roc_auc'
  random_state: 42
  shap:
    n_samples_explain: 100  # Número de muestras a explicar con SHAP
    n_background_samples: 100  # Número de muestras de fondo para SHAP
    top_n_features: 20  # Top N features más importantes a reportar
  models:
    logistic_regression:
      param_grid:
        C: [0.1, 1.0]  # Reducido de 3 a 2 valores
        penalty: ['l2']  # Solo L2 para simplificar
        solver: ['saga']
    random_forest:
      param_grid:
        n_estimators: [100, 200]  # Reducido de 3 a 2 valores
        max_depth: [10, 20]  # Removido None para reducir combinaciones
        min_samples_split: [2]  # Solo un valor
    xgboost:
      param_grid:
        max_depth: [3, 5]  # Reducido de 3 a 2 valores
        learning_rate: [0.1, 0.3]  # Reducido de 3 a 2 valores
        n_estimators: [100]  # Solo un valor
    svc:
      param_grid:
        C: [1.0]  # Solo un valor para acelerar (LinearSVC es mucho más rápido)
    lightgbm:
      param_grid:
        max_depth: [3, 5]  # Reducido de 3 a 2 valores
        learning_rate: [0.1, 0.3]  # Reducido de 3 a 2 valores
        n_estimators: [100]  # Solo un valor

# Regression parameters
regression:
  cv_folds: 3  # Aún más reducido para usar menos recursos
  scoring: 'neg_mean_absolute_error'
  random_state: 42
  shap:
    n_samples_explain: 100  # Número de muestras a explicar con SHAP
    n_background_samples: 100  # Número de muestras de fondo para SHAP
    top_n_features: 20  # Top N features más importantes a reportar
  models:
    linear_regression:
      param_grid:
        fit_intercept: [True]  # Solo un valor para simplificar
    ridge:
      param_grid:
        alpha: [0.1, 1.0, 10.0]  # Reducido de 4 a 3 valores
    random_forest:
      param_grid:
        n_estimators: [50]  # Menos árboles
        max_depth: [10]  # Profundidad fija
        max_features: ['sqrt']  # Menos variables por split
        min_samples_leaf: [2]  # Hojas mínimas para reducir sobreajuste y coste
    xgboost:
      param_grid:
        max_depth: [3, 5]  # Reducido de 3 a 2 valores
        learning_rate: [0.1, 0.3]  # Reducido de 3 a 2 valores
        n_estimators: [100]  # Solo un valor
    svr:
      param_grid:
        C: [1.0]  # Valor único para acelerar
        epsilon: [0.1]  # Valor único
    lightgbm:
      param_grid:
        max_depth: [3, 5]  # Reducido de 3 a 2 valores
        learning_rate: [0.1, 0.3]  # Reducido de 3 a 2 valores
        n_estimators: [100]  # Solo un valor

# Unsupervised Learning (Clustering) parameters
unsupervised_learning:
  random_state: 42
  models:
    kmeans:
      n_clusters: 5  # Número de clusters para K-Means
      max_iter: 300  # Máximo de iteraciones
      n_init: 10  # Número de inicializaciones
      calculate_elbow: true  # Calcular método del codo
      elbow_k_range: [2, 3, 4, 5, 6, 7, 8, 9, 10]  # Rango de k para método del codo
    optics:
      min_samples: 5  # Número mínimo de muestras en un cluster
      max_eps: null  # Distancia máxima entre muestras (null = sin límite, se convierte a np.inf)
      metric: 'euclidean'  # Métrica de distancia ('euclidean', 'manhattan', etc.)
      n_jobs: -1  # Número de trabajos paralelos (-1 = todos los cores)
    hierarchical:
      n_clusters: 5  # Número de clusters para Hierarchical Clustering
      linkage: 'ward'  # Método de linkage ('ward', 'complete', 'average', 'single')
      metric: 'euclidean'  # Métrica de distancia (solo si linkage != 'ward')
      calculate_dendrogram: true  # Calcular datos del dendrograma
      max_samples_dendrogram: 5000  # Máximo de muestras para calcular dendrograma (por rendimiento)

# Dimensionality Reduction parameters
dimensionality_reduction:
  random_state: 42
  models:
    pca:
      n_components: null  # null = usar variance_threshold, int = número fijo, float = fracción de varianza
      variance_threshold: 0.95  # Usar componentes suficientes para explicar 95% de varianza
      n_top_features_per_component: 5  # Número de features top a guardar por componente
    umap:
      n_components: 2  # Número de dimensiones de salida (típicamente 2 o 3 para visualización)
      n_neighbors: 15  # Número de vecinos para construir el grafo (valores típicos: 5-50)
      min_dist: 0.1  # Distancia mínima entre puntos en el espacio de salida (0.0-1.0)
      metric: 'euclidean'  # Métrica de distancia ('euclidean', 'manhattan', 'cosine', etc.)

# Anomaly Detection parameters
anomaly_detection:
  random_state: 42
  models:
    isolation_forest:
      contamination: 0.1  # Proporción esperada de anomalías (0.0-0.5)
      n_estimators: 100  # Número de árboles en el ensemble
      max_samples: 'auto'  # Número de muestras para entrenar cada árbol ('auto' = min(256, n_samples))
    lof:
      n_neighbors: 20  # Número de vecinos para calcular el factor de outlier local
      contamination: 0.1  # Proporción esperada de anomalías (0.0-0.5)
      metric: 'euclidean'  # Métrica de distancia ('euclidean', 'manhattan', etc.)
    oneclass_svm:
      nu: 0.1  # Proporción esperada de anomalías (0.0-1.0)
      kernel: 'rbf'  # Tipo de kernel ('rbf', 'linear', 'poly', 'sigmoid')
      gamma: 'scale'  # Coeficiente del kernel ('scale', 'auto', o valor numérico)
    autoencoder:
      encoding_dim: 32  # Dimensión de la capa de codificación (bottleneck)
      hidden_layers: [64, 32]  # Capas ocultas del encoder/decoder
      epochs: 50  # Número de épocas de entrenamiento
      batch_size: 32  # Tamaño del batch
      threshold_percentile: 95  # Percentil para determinar el umbral de anomalía

# Association Rules parameters
association_rules:
  models:
    apriori:
      min_support: 0.1  # Soporte mínimo para itemsets frecuentes (0.0-1.0)
      min_confidence: 0.5  # Confianza mínima para reglas (0.0-1.0)
      min_lift: 1.0  # Lift mínimo para reglas (valores > 1.0 indican asociación positiva)
      max_len: null  # Longitud máxima de itemsets (null = sin límite)
      use_colnames: true  # Usar nombres de columnas en lugar de índices
    fpgrowth:
      min_support: 0.1  # Soporte mínimo para itemsets frecuentes (0.0-1.0)
      min_confidence: 0.5  # Confianza mínima para reglas (0.0-1.0)
      min_lift: 1.0  # Lift mínimo para reglas (valores > 1.0 indican asociación positiva)
      max_len: null  # Longitud máxima de itemsets (null = sin límite)
      use_colnames: true  # Usar nombres de columnas en lugar de índices